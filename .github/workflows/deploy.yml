name: Flask Demo CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on:
      - codebuild-flask-demo-private-${{ github.run_id }}-${{ github.run_attempt }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      run: |
        pyenv global 3.12
        echo "Python Version Check..."
        python --version
        
    - name: Get CodeArtifact token
      run: |
        export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
          --domain $CODEARTIFACT_DOMAIN \
          --domain-owner $AWS_ACCOUNT_ID \
          --region $AWS_DEFAULT_REGION \
          --query authorizationToken --output text)
        echo "CODEARTIFACT_AUTH_TOKEN=$CODEARTIFACT_AUTH_TOKEN" >> $GITHUB_ENV
        
    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
        docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        
    - name: Generate version tag
      run: |
        export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
        LATEST_TAG=$(aws ecr describe-images --repository-name $IMAGE_REPO_NAME --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' --output text 2>/dev/null || echo "0")
        if [ "$LATEST_TAG" = "None" ] || [ "$LATEST_TAG" = "null" ] || [ "$LATEST_TAG" = "0" ]; then
          NEW_TAG=1
        else
          NEW_TAG=$((LATEST_TAG + 1))
        fi
        echo "IMAGE_TAG=$NEW_TAG" >> $GITHUB_ENV
        echo "Using image tag: $NEW_TAG"
        
    - name: Debug environment variables
      run: |
        echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
        echo "AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID"
        echo "IMAGE_REPO_NAME: $IMAGE_REPO_NAME"
        echo "IMAGE_TAG: $IMAGE_TAG"
        echo "CODEARTIFACT_DOMAIN: $CODEARTIFACT_DOMAIN"
        echo "CODEARTIFACT_REPOSITORY: $CODEARTIFACT_REPOSITORY"
        echo "CODEARTIFACT_AUTH_TOKEN: ${CODEARTIFACT_AUTH_TOKEN:0:10}..."
        
    - name: Build Docker image
      run: |
        export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
        echo "Building Docker image: $IMAGE_REPO_NAME:$IMAGE_TAG"
        echo "Repository URI: $REPOSITORY_URI"
        
        docker buildx build --load \
          -t $REPOSITORY_URI:$IMAGE_TAG \
          --build-arg AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION \
          --build-arg CODEARTIFACT_AUTH_TOKEN="$CODEARTIFACT_AUTH_TOKEN" \
          --build-arg CODEARTIFACT_DOMAIN=$CODEARTIFACT_DOMAIN \
          --build-arg CODEARTIFACT_REPOSITORY=$CODEARTIFACT_REPOSITORY \
          --build-arg AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID \
          --progress=plain \
          .
        
    - name: Push to ECR
      run: |
        export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
        docker push $REPOSITORY_URI:$IMAGE_TAG
        
    - name: Create deployment artifacts
      run: |
        export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
        echo $REPOSITORY_URI:$IMAGE_TAG > image_uri.txt
        sed -i "s|IMAGE_URI_PLACEHOLDER|$REPOSITORY_URI:$IMAGE_TAG|g" scripts/start_application.sh